name: Linux build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          /usr/bin/python3 - <<'PY'
          import os, re
          from lifus import __version__
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', __version__):
              raise SystemExit('Expected a numeric X.Y.Z version in lifus/__init__.py')
          if os.environ['REF_TYPE'] == 'tag' and os.environ['REF_NAME'] != 'v' + __version__:
              raise SystemExit('Release tag must match lifus/__init__.py: v' + __version__)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version=' + __version__ + '\n')
          PY
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-tk dpkg-dev sudo util-linux fdisk parted \
            dosfstools e2fsprogs exfatprogs ntfs-3g mtools p7zip-full wimtools \
            xorriso xvfb xauth
      - name: Test
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build and verify release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          /usr/bin/python3 build-deb.py --version "$VERSION"
          /usr/bin/python3 build-source.py --version "$VERSION"
          xvfb-run -a /usr/bin/python3 packaging/verify-release.py --version "$VERSION"
      - name: Upload verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: lifus-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            dist/lifus_*-1_all.deb
            dist/lifus-*-source.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node.js 24)
        with:
          name: lifus-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$TAG" \
            "lifus_${VERSION}-1_all.deb" "lifus-${VERSION}-source.tar.gz" SHA256SUMS \
            --verify-tag --title "Lifus $VERSION" \
            --notes 'Experimental native Linux USB utility. Includes a Debian/Ubuntu package, application source archive and SHA-256 checksums. Distributors must verify corresponding-source obligations for bundled third-party boot binaries (see COPYING.md). Automated tests do not certify physical USB writes, Windows installation or Secure Boot.'
